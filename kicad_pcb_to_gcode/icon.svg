<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- PCB Substrate -->
  <rect x="4" y="12" width="56" height="48" rx="6" fill="#1b4332" stroke="#2d6a4f" stroke-width="2"/>
  
  <!-- Copper Traces -->
  <path d="M 10 48 L 28 48 L 38 38 L 54 38" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 10 24 L 24 24 L 32 32" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Through-Hole Pads -->
  <!-- Pad 1 -->
  <circle cx="28" cy="48" r="5" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
  <circle cx="28" cy="48" r="2.5" fill="#0b1d14"/>
  
  <!-- Pad 2 -->
  <circle cx="54" cy="38" r="5" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
  <circle cx="54" cy="38" r="2.5" fill="#0b1d14"/>
  
  <!-- Mounting Hole -->
  <circle cx="14" cy="32" r="5" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
  <circle cx="14" cy="32" r="3" fill="#0b1d14"/>

  <!-- CNC Spindle & Drill Bit -->
  <!-- Collet -->
  <rect x="25" y="2" width="6" height="14" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <rect x="23" y="14" width="10" height="8" rx="1" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <!-- Carbide Drill Shank & Flutes -->
  <polygon points="26,22 30,22 30,38 28,45 26,38" fill="#e2e8f0" stroke="#64748b" stroke-width="0.8"/>
  <line x1="26" y1="26" x2="30" y2="29" stroke="#64748b" stroke-width="1"/>
  <line x1="26" y1="32" x2="30" y2="35" stroke="#64748b" stroke-width="1"/>
  
  <!-- Milling Sparkles -->
  <circle cx="23" cy="43" r="0.8" fill="#fef08a"/>
  <circle cx="33" cy="42" r="0.8" fill="#fef08a"/>
  <circle cx="25" cy="40" r="0.8" fill="#fef08a"/>
  <circle cx="31" cy="46" r="0.8" fill="#fef08a"/>
</svg>
